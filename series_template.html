<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f3f2ee;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6;
  --good: #006300; --critical: #d03b3b; --warning: #a86b00; --wash: rgba(42,120,214,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5;
    --good: #0ca30c; --critical: #e66767; --warning: #d99a1e; --wash: rgba(57,135,229,0.12);
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5;
  --good: #0ca30c; --critical: #e66767; --warning: #d99a1e; --wash: rgba(57,135,229,0.12);
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root {
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--page); color: var(--text-primary); min-height: 100vh;
  font-size: 14px; line-height: 1.45;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 24px 64px; }
header.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
header.top nav { display: flex; gap: 6px; align-items: center; }
.brand { font-weight: 650; font-size: 15px; text-decoration: none; margin-right: 10px; }
h1 { font-size: 26px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
.sub { color: var(--text-secondary); margin: 0; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
button, select, input {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; }
button[aria-pressed="true"], a.btn[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
a.btn { display: inline-block; text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
        background: var(--surface-1); }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 18px 0 22px; }
.tile .label { color: var(--text-secondary); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 600; margin-top: 2px; }
.tile .note { color: var(--text-muted); font-size: 12px; }
.section { margin-top: 28px; }
.proj-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 0 10px; flex-wrap: wrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
a.scard { display: block; text-decoration: none; }
a.scard:hover { border-color: var(--axis); background: var(--wash); }
.scard h3 { font-size: 16px; margin: 0; }
.scard .zh { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; font-size: 13px; margin-top: 10px; }
.kv dt { color: var(--text-secondary); }
.kv dd { margin: 0; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border);
        color: var(--text-secondary); white-space: nowrap; vertical-align: 1px; text-decoration: none; }
a.chip:hover { background: var(--wash); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 9px;
        border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
.pill.good { color: var(--good); border-color: currentColor; }
.pill.warn { color: var(--warning); border-color: currentColor; }
.pill.none { color: var(--text-muted); }
.steps { display: flex; gap: 3px; margin-top: 4px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--grid); }
.steps i.on { background: var(--s1); border-color: var(--s1); }
nav.tabs { display: flex; gap: 6px; margin: 4px 0 16px; flex-wrap: wrap; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.filters label { color: var(--text-secondary); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--text-secondary); font-size: 12px; padding: 6px 8px;
     border-bottom: 1px solid var(--axis); white-space: nowrap; }
th.num, td.num { text-align: right; }
td { padding: 8px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
td.num { white-space: nowrap; }
tr.below td { color: var(--text-secondary); }
tr.below .nm { font-weight: 500; }
tr.cut td { padding: 6px 8px; font-size: 12px; color: var(--text-muted); background: var(--surface-2);
            border-bottom: 1px solid var(--axis); text-align: center; letter-spacing: .02em; }
.rank { font-weight: 600; font-size: 15px; width: 36px; }
.venue .nm { font-weight: 600; }
.venue .hd { color: var(--text-muted); font-size: 12px; }
.venue .sm { color: var(--text-secondary); font-size: 12px; max-width: 520px; margin-top: 2px; }
.scorecell { display: flex; align-items: center; gap: 8px; }
.scorecell b { width: 34px; text-align: right; font-weight: 600; }
.track { width: 120px; height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; position: relative; }
.track span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 4px 4px 0; }
.delta { font-size: 12px; font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--good); }
.delta.down { color: var(--critical); }
.delta.new { color: var(--s1); }
.delta.same { color: var(--text-muted); font-weight: 400; }
.post { display: grid; grid-template-columns: 1fr 1.1fr; gap: 18px; margin-bottom: 14px; }
.post > div { min-width: 0; }
@media (max-width: 900px) { .post { grid-template-columns: 1fr; } }
.post h3 { font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.thumbs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; margin: 8px 0; }
.thumbs img { height: 120px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }
ol.shops { margin: 6px 0 0; padding-left: 0; list-style: none; columns: 2; column-gap: 18px; font-size: 13px; }
ol.shops li { break-inside: avoid; margin-bottom: 2px; }
ol.shops li b { display: inline-block; width: 34px; color: var(--text-secondary); font-weight: 500; }
ol.shops li.chg { color: var(--warning); }
pre.caption { white-space: pre-wrap; font: inherit; font-size: 12.5px; background: var(--surface-2); border-radius: 8px;
              padding: 10px 12px; max-height: 260px; overflow: auto; margin: 8px 0 0; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
.callout { border-left: 3px solid var(--axis); padding: 8px 12px; background: var(--surface-1); margin: 0 0 14px;
        color: var(--text-secondary); border-radius: 0 8px 8px 0; }
.callout.warn { border-left-color: var(--warning); }
.cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-secondary); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
ul.moves { list-style: none; margin: 0; padding: 0; font-size: 13px; }
ul.moves li { padding: 4px 0; border-bottom: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 10px; }
td.vr { text-align: center; white-space: nowrap; }
td.vr.in b { font-weight: 650; }
td.vr.out { color: var(--text-muted); }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
       border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
       display: none; z-index: 10; max-width: 280px; }
#tip .t { font-weight: 600; margin-bottom: 3px; }
#tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--text-secondary); }
.empty { color: var(--text-muted); padding: 18px 0; }
/* Editing (when series_server.py serves the page) */
.mode { font-size: 12px; color: var(--text-muted); margin-right: 8px; }
.mode b { color: var(--good); font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.primary { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
button.danger { color: var(--critical); }
button:disabled { opacity: .45; cursor: not-allowed; }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(860px, 94vw); max-height: 92vh; overflow: hidden;
         background: var(--surface-1); color: var(--text-primary); box-shadow: 0 12px 48px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { display: flex; flex-direction: column; max-height: 92vh; }
dialog .dh, dialog .df { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
dialog .dh { border-bottom: 1px solid var(--border); }
dialog .df { border-top: 1px solid var(--border); }
dialog .db { padding: 16px 20px; overflow-y: auto; }
.fgrid { display: grid; grid-template-columns: 170px 1fr; gap: 10px 14px; align-items: start; }
.fgrid > label { color: var(--text-secondary); font-size: 13px; padding-top: 7px; }
.fgrid input[type=text], .fgrid input[type=number], .fgrid select, .fgrid textarea { width: 100%; }
.fgrid textarea { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border);
                  border-radius: 8px; padding: 6px 10px; resize: vertical; }
.fgrid .hint { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
.fgrid h4 { grid-column: 1 / -1; margin: 12px 0 0; font-size: 13px; font-weight: 600; border-top: 1px solid var(--grid); padding-top: 12px; }
.districts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; font-size: 13px;
             max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.districts label { display: flex; gap: 6px; align-items: center; color: var(--text-primary); }
.districts em { font-style: normal; color: var(--text-muted); margin-left: auto; }
.headline3 { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 6px; }
.count { font-size: 13px; }
.count.warn { color: var(--warning); }
.rowacts { white-space: nowrap; }
.rowacts button { padding: 2px 7px; font-size: 12px; }
.chip.pinned { border-color: var(--s1); color: var(--s1); }
.pubform { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.pubform input[type=url] { flex: 1; min-width: 220px; }
pre.log { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12px; max-height: 260px; overflow: auto;
          white-space: pre-wrap; margin: 8px 0 0; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1);
         padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 20; max-width: 80vw; }
#toast.err { background: var(--critical); color: #fff; }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <header class="top">
    <nav>
      <a class="brand" href="#/">Series dashboard</a>
      <a class="btn" href="#/" data-nav="overview">Overview</a>
      <a class="btn" href="#/venues" data-nav="venues">Venues</a>
    </nav>
    <div class="actions"><span class="mode" id="mode"></span><button id="theme" title="Toggle light / dark">◐ Theme</button></div>
  </header>
  <main id="main"></main>
  <p class="muted small" id="foot"></p>
</div>
<div id="tip"></div>
<div id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
</div>
<script>
const DATA = /*DATA*/null;
const LIVE = DATA.live;  // set when series_server.py serves the page: editing on
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null ? "–" : Number(n).toLocaleString();
const $ = id => document.getElementById(id);
const SERIES = Object.fromEntries(DATA.series.map(s => [s.id, s]));
const COMP = { network: "Network endorsement", quality: "Google rating", press: "Press & bloggers",
               volume: "Google review volume", reach: "Instagram reach", product: "Product reviews" };

// --- Derived ---------------------------------------------------------------------------
// The series' venues are keyed by brand when they are entered through a branch, so a brand that
// switches branch between snapshots still compares as the same entry.
const key = e => e.brand || e.handle;
const latestSnap = s => s.snapshots[s.snapshots.length - 1] || null;
const topOf = (entries, top) => entries.filter(e => e.rank <= top);
const publishedCount = snap => snap ? snap.posts.filter(p => p.published).length : 0;
// Each venue's rank in every series it is a candidate of (handle -> [{s, rank, top}]).
const RANKS = {};
DATA.series.forEach(s => s.entries.forEach(e => {
  (RANKS[e.handle] = RANKS[e.handle] || []).push({ s, rank: e.rank, top: e.rank <= s.top_n });
}));

function compare(from, to, top) {
  // Changes from one ranking to another (each a list of entries with rank): who entered and left
  // the top N, and how far each kept entry moved.
  const was = new Map(from.map(e => [key(e), e])), now = new Map(to.map(e => [key(e), e]));
  const inTop = (m, k) => m.has(k) && m.get(k).rank <= top;
  const entered = to.filter(e => e.rank <= top && !inTop(was, key(e)));
  const left = from.filter(e => e.rank <= top && !inTop(now, key(e)));
  const moved = to.filter(e => e.rank <= top && inTop(was, key(e)))
                  .map(e => ({ e, d: was.get(key(e)).rank - e.rank }));
  return { was, entered, left, moved };
}

function liveDiff(s) {
  const snap = latestSnap(s);
  if (!snap) return null;
  return compare(snap.entries, s.entries, s.top_n);
}

function deltaHTML(e, was, top) {
  if (!was) return "";
  const o = was.get(key(e));
  if (!o || o.rank > top) return e.rank <= top ? `<span class="delta new">new${o ? ` (was ${o.rank})` : ""}</span>` : "";
  const d = o.rank - e.rank;
  if (d > 0) return `<span class="delta up" title="was No. ${o.rank}">▲ ${d}</span>`;
  if (d < 0) return `<span class="delta down" title="was No. ${o.rank}">▼ ${-d}</span>`;
  return `<span class="delta same">–</span>`;
}

function filterText(s) {
  const f = s.filter || {};
  const parts = Object.entries(f).map(([k, v]) => {
    const vals = [].concat(v).map(x => k === "district" ? (DATA.projects[s.project].districts[x] || x) : x);
    return `${k}: ${vals.join(", ")}`;
  });
  return parts.length ? parts.join(" · ") : "all candidates";
}

// --- Overview --------------------------------------------------------------------------
function overview() {
  const multi = Object.values(RANKS).filter(r => r.filter(x => x.top).length > 1).length;
  const ranked = Object.values(RANKS).filter(r => r.some(x => x.top)).length;
  const posts = DATA.series.reduce((n, s) => n + (latestSnap(s) ? latestSnap(s).posts.length : s.posts.length), 0);
  const pub = DATA.series.reduce((n, s) => n + publishedCount(latestSnap(s)), 0);
  let html = `<div class="title-row"><h1>Series</h1>${LIVE ? `<button class="primary" data-new="">+ New series</button>` : ""}</div>
    <p class="sub">Every countdown, the pool it ranks, its posts and its snapshots. A series ranks one project's candidates,
      all of them or one district; the same venue can be an entry in several series.</p>
    <div class="tiles">
      ${tile("Series", DATA.series.length, `${Object.keys(DATA.projects).length} projects`)}
      ${tile("Venues ranked", ranked, "in at least one series' top N")}
      ${tile("In 2+ series", multi, `<a href="#/venues">see venues</a>`)}
      ${tile("Posts published", `${pub} / ${posts}`, "in each series' latest snapshot")}
    </div>`;
  for (const [pid, p] of Object.entries(DATA.projects)) {
    const list = DATA.series.filter(s => s.project === pid);
    html += `<div class="proj-head"><h2>${esc(p.title)} <span class="muted small">project ${esc(pid)}</span></h2>
      <span class="muted small">${fmt(p.n_candidates)} candidates · ranked ${esc(rankedText(p))} ·
        <a href="${esc(p.ranking_html)}">project ranking &amp; methodology</a>
        ${LIVE ? ` · <button data-new="${esc(pid)}">+ New ${esc(pid)} series</button>` : ""}</span></div>
      <div class="cards">${list.map(card).join("") || `<div class="muted">No series yet.</div>`}</div>`;
  }
  return html;
}

function rankedText(p) {
  if (p.ranked && p.ranked.commit) return p.ranked.commit.split(" ")[1] + (p.ranked.modified ? " (changed since)" : "");
  return p.updated ? p.updated.slice(0, 10) : "not yet";
}

function tile(label, value, note) {
  return `<div class="card tile"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note || ""}</div></div>`;
}

function card(s) {
  const snap = latestSnap(s), diff = liveDiff(s);
  const n = snap ? snap.posts.length : s.posts.length, pub = publishedCount(snap);
  const rendered = Object.keys(s.rendered).length;
  const status = s.warning ? `<span class="pill warn">△ too few candidates</span>`
    : !snap ? `<span class="pill none">○ no snapshot</span>`
    : diff.entered.length ? `<span class="pill warn">△ ${diff.entered.length} in / ${diff.left.length} out since ${snap.date}</span>`
    : `<span class="pill good">✓ live matches ${snap.date}</span>`;
  const top3 = s.entries.slice(0, 3).map(e => esc(e.display)).join(" · ");
  return `<a class="card scard" href="#/s/${s.id}/rankings">
    <h3>${esc(s.title)}</h3><div class="zh">${esc(s.zh)}</div>
    <div class="chips"><span class="chip">top ${s.top_n} of ${s.entries.length}</span><span class="chip">${esc(filterText(s))}</span></div>
    <dl class="kv">
      <dt>Top 3 now</dt><dd>${top3 || "–"}</dd>
      <dt>Latest snapshot</dt><dd>${status}</dd>
      <dt>Posts</dt><dd>${pub} of ${n} published · ${rendered ? `${rendered} rendered` : "not rendered"}
        <div class="steps">${Array.from({ length: n }, (_, i) => `<i class="${snap && snap.posts[i].published ? "on" : ""}"></i>`).join("")}</div></dd>
    </dl></a>`;
}

// --- Venues ----------------------------------------------------------------------------
const VSTATE = { multi: true, q: "" };
function venues() {
  const cols = DATA.series;
  let rows = Object.entries(RANKS).filter(([, r]) => r.some(x => x.top));
  const multi = rows.filter(([, r]) => r.filter(x => x.top).length > 1).length;
  if (VSTATE.multi) rows = rows.filter(([, r]) => r.filter(x => x.top).length > 1);
  const q = VSTATE.q.toLowerCase();
  if (q) rows = rows.filter(([h]) => (h + " " + (DATA.venues[h] || {}).display).toLowerCase().includes(q));
  const best = r => Math.min(...r.map(x => x.top ? x.rank / x.s.top_n : 9));
  rows.sort((a, b) => b[1].filter(x => x.top).length - a[1].filter(x => x.top).length || best(a[1]) - best(b[1]));
  return `<h1>Venues</h1>
    <p class="sub">A venue is one Instagram account (one shop or branch). Each column is a series: its rank there,
      <b>bold</b> inside the top N, grey when it is a candidate below the cut, blank when it isn't in that series' pool.</p>
    <div class="filters" style="margin-top:16px">
      <input id="vq" type="search" placeholder="Search venues" value="${esc(VSTATE.q)}">
      <label><input id="vmulti" type="checkbox" ${VSTATE.multi ? "checked" : ""}> only venues in the top N of 2+ series (${multi})</label>
      <span class="muted small">${rows.length} venues</span>
    </div>
    <div class="card" style="overflow-x:auto"><table>
      <thead><tr><th>Venue</th><th>District</th>${cols.map(s => `<th class="num" title="${esc(s.title)}"><a href="#/s/${s.id}/rankings">${esc(shortTitle(s))}</a></th>`).join("")}</tr></thead>
      <tbody>${rows.map(([h, r]) => {
        const v = DATA.venues[h] || {};
        return `<tr><td class="venue"><div class="nm">${esc(v.display || h)}</div><div class="hd"><a href="${esc(v.ig)}" target="_blank">@${esc(h)}</a></div></td>
          <td>${esc(districtName(v))}</td>
          ${cols.map(s => { const x = r.find(x => x.s === s);
            return !x ? `<td class="vr"></td>` : `<td class="vr ${x.top ? "in" : "out"}">${x.top ? `<b>${x.rank}</b>` : x.rank}</td>`; }).join("")}</tr>`;
      }).join("") || `<tr><td colspan="${cols.length + 2}" class="empty">No venues match.</td></tr>`}</tbody>
    </table></div>`;
}

const shortTitle = s => s.short || s.title;

function districtName(e) {
  for (const p of Object.values(DATA.projects)) if (p.districts[e.district]) return p.districts[e.district];
  return e.district || "";
}

// --- One series ------------------------------------------------------------------------
const STATE = {}; // per series: {base, all, q, from, to}
function stateOf(s) {
  const snap = latestSnap(s);
  if (STATE[s.id]) return STATE[s.id];
  // "What changed" opens on the latest snapshot vs live if the live ranking has moved since,
  // else on the snapshot before it vs the latest.
  const d = liveDiff(s), prev = s.snapshots[s.snapshots.length - 2];
  const moved = d && (d.entered.length || d.moved.some(m => m.d));
  const [from, to] = !snap ? ["", "live"] : moved || !prev ? [snap.date, "live"] : [prev.date, snap.date];
  return STATE[s.id] = { base: snap ? snap.date : "", all: false, q: "", from, to };
}

function seriesPage(s, tab) {
  const p = DATA.projects[s.project], snap = latestSnap(s), diff = liveDiff(s);
  const n = snap ? snap.posts.length : s.posts.length;
  const links = [
    `<a href="${esc(p.ranking_html)}">project ranking</a>`,
    s.posts_preview ? `<a href="${esc(s.posts_preview)}">posts preview</a>` : null,
    `<code>${esc(s.path)}</code>`,
  ].filter(Boolean).join(" · ");
  const body = tab === "posts" ? postsTab(s) : tab === "snapshots" ? snapshotsTab(s) : rankingsTab(s);
  return `<div class="muted small"><a href="#/">Series</a> › ${esc(p.title)}</div>
    <div class="title-row"><h1>${esc(s.title)}</h1>${LIVE ? `<div class="actions">
      <button data-edit="${s.id}">Edit</button>
      <button data-snap="${s.id}" ${s.warning ? "disabled" : ""}>Take snapshot</button>
      <button class="danger" data-del="${s.id}" ${s.snapshots.length ? `disabled title="Has snapshots: delete their files by hand if you mean it"` : ""}>Delete</button>
    </div>` : ""}</div>
    <p class="sub">${esc(s.zh)} · project <b>${esc(s.project)}</b> · ${esc(filterText(s))} · ${links}</p>
    <div class="tiles">
      ${tile("Candidates", s.entries.length, `ranked within the series; project pool ${fmt(p.n_candidates)}${s.excluded.length ? ` · ${s.excluded.length} left out by hand` : ""}`)}
      ${tile("Entries", s.top_n, `counted down in ${n} post${n > 1 ? "s" : ""}`)}
      ${tile("Posts published", `${publishedCount(snap)} / ${n}`, snap ? `in the ${snap.date} snapshot` : "take a snapshot to track them")}
      ${tile("Snapshots", s.snapshots.length, snap ? (diff.entered.length ? `${diff.entered.length} in / ${diff.left.length} out since ${snap.date}` : `live matches ${snap.date}`) : "none yet")}
    </div>
    ${s.warning ? `<div class="callout warn">${esc(s.warning)}</div>` : ""}
    <nav class="tabs">${["rankings", "posts", "snapshots"].map(t =>
      `<a class="btn" href="#/s/${s.id}/${t}" aria-pressed="${t === tab}">${t[0].toUpperCase() + t.slice(1)}</a>`).join("")}</nav>
    ${body}`;
}

function rankingsTab(s) {
  const st = stateOf(s);
  const base = s.snapshots.find(x => x.date === st.base);
  const was = base ? new Map(base.entries.map(e => [key(e), e])) : null;
  const postOf = {};
  s.posts.forEach(p => p.handles.forEach(h => { postOf[h] = p; }));
  const q = st.q.toLowerCase();
  let rows = st.all ? s.entries : s.entries.filter(e => e.rank <= s.top_n);
  if (q) rows = rows.filter(e => (e.handle + " " + e.display + " " + districtName(e)).toLowerCase().includes(q));
  const max = Math.max(...s.entries.map(e => e.score), 1);
  const types = DATA.projects[s.project].types;
  const filtered = s.filter && Object.keys(s.filter).length > 0, ncol = (filtered ? 9 : 8) + (LIVE ? 1 : 0);
  let body = "";
  rows.forEach((e, i) => {
    if (st.all && !q && e.rank === s.top_n + 1) body += `<tr class="cut"><td colspan="${ncol}">top ${s.top_n} cut · ${s.entries.length - s.top_n} more candidates below</td></tr>`;
    const others = (RANKS[e.handle] || []).filter(x => x.s !== s && x.top);
    const p = postOf[e.handle];
    body += `<tr class="${e.rank > s.top_n ? "below" : ""}">
      <td class="rank">${e.rank}</td>
      <td>${deltaHTML(e, was, s.top_n)}</td>
      <td class="venue"><div class="nm">${esc(e.display)}</div>
        <div class="hd"><a href="${esc(e.ig)}" target="_blank">@${esc(e.handle)}</a>
          ${e.brand ? ` <span class="chip" title="Entered through this branch; the brand's best-scoring branch is @${esc(e.brand)}">branch of @${esc(e.brand)}</span>` : ""}
          ${e.pinned ? ` <span class="chip pinned" title="${esc(e.pin_note || "Placed by hand")}">pinned · score rank ${e.score_rank}${e.pin_note ? " · " + esc(e.pin_note) : ""}</span>` : ""}
          ${others.map(x => ` <a class="chip" href="#/s/${x.s.id}/rankings" title="${esc(x.s.title)}">No. ${x.rank} in ${esc(shortTitle(x.s))}</a>`).join("")}</div>
        ${e.summary && e.rank <= s.top_n ? `<div class="sm">${esc(e.summary)}</div>` : ""}</td>
      <td>${esc(types[e.type] || e.type)}</td>
      <td>${esc(districtName(e))}</td>
      <td><div class="scorecell" data-tip="${esc(e.handle)}"><b>${e.score.toFixed(1)}</b><div class="track"><span style="width:${(e.score / max * 100).toFixed(1)}%"></span></div></div></td>
      <td class="num">${e.rating ? `★ ${e.rating.toFixed(1)} <span class="muted">(${fmt(e.reviews)})</span>` : "–"}</td>
      ${filtered ? `<td class="num">${e.pool_rank}</td>` : ""}
      <td>${p ? `<a href="#/s/${s.id}/posts" class="chip">Part ${p.n}</a>` : ""}</td>
      ${LIVE ? `<td class="rowacts" data-h="${esc(key(e))}" data-rank="${e.rank}">
        <button data-act="up" title="Move up one place" ${e.rank === 1 ? "disabled" : ""}>↑</button><button data-act="down" title="Move down one place" ${e.rank === s.entries.length ? "disabled" : ""}>↓</button>
        <button data-act="pin" title="Put at a rank">Pin…</button>${e.pinned ? `<button data-act="unpin" title="Back to its score place">Unpin</button>` : ""}
        <button data-act="exclude" class="danger" title="Leave out of this series">Remove…</button></td>` : ""}</tr>`;
  });
  const left = base ? compare(base.entries, s.entries, s.top_n).left : [];
  const now = new Map(s.entries.map(e => [key(e), e]));
  return `<div class="filters">
      <label>Compare with <select id="base"><option value="">nothing</option>
        ${s.snapshots.map(x => `<option value="${x.date}" ${x.date === st.base ? "selected" : ""}>snapshot ${x.date}${x.label ? ` · ${esc(x.label)}` : ""}</option>`).join("")}</select></label>
      <input id="q" type="search" placeholder="Search" value="${esc(st.q)}">
      <label><input id="all" type="checkbox" ${st.all ? "checked" : ""}> show all ${s.entries.length} candidates</label>
    </div>
    ${base ? "" : s.snapshots.length ? "" : `<div class="callout">No snapshot yet, so there is nothing to compare with. When the posts go out, freeze this ranking${LIVE
      ? " with <b>Take snapshot</b>." : `: <span class="cmd">python3 -I series.py snapshot ${s.id} --label "First edition"</span>`}</div>`}
    ${handEdits(s)}
    <div class="card" style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>${base ? `vs ${base.date}` : ""}</th><th>Venue</th><th>Type</th><th>District</th><th>Score</th>
        <th class="num">Google</th>${s.filter && Object.keys(s.filter).length ? `<th class="num" title="Rank among all of the project's candidates">Overall</th>` : ""}<th>Post</th>${LIVE ? "<th>Adjust</th>" : ""}</tr></thead>
      <tbody>${body || `<tr><td colspan="${ncol}" class="empty">No candidates match.</td></tr>`}</tbody></table></div>
    ${s.excluded.length ? `<div class="section card"><h3>Left out of this series by hand</h3><ul class="moves">${s.excluded.map(e =>
      `<li><span>${esc(e.display)} <span class="muted">@${esc(e.handle)} · would be No. ${e.score_rank || "?"} by score</span> — ${esc(e.reason)}</span>
        <span>${LIVE ? `<button data-restore="${esc(key(e))}">Restore</button>` : ""}</span></li>`).join("")}</ul></div>` : ""}
    ${left.length ? `<div class="section card"><h3>Left the top ${s.top_n} since ${base.date}</h3><ul class="moves">${left.map(e => {
        const n = now.get(key(e));
        return `<li><span>${esc(e.display)} <span class="muted">@${esc(e.handle)}</span></span><span>No. ${e.rank} → ${n ? `No. ${n.rank}` : "no longer a candidate"}</span></li>`;
      }).join("")}</ul></div>` : ""}`;
}

function handEdits(s) {
  const pins = s.entries.filter(e => e.pinned).length, out = s.excluded.length;
  if (!pins && !out && !s.stale.length) return "";
  const parts = [pins && `${pins} pinned`, out && `${out} left out`].filter(Boolean).join(", ");
  return `<div class="callout">Hand edits in this series: ${parts || "none in effect"}. The rest are in score order.
    ${s.stale.length ? `<br><span style="color:var(--warning)">No effect (not a candidate of this series any more): ${s.stale.map(h => "@" + esc(h)).join(", ")}</span>` : ""}
    ${LIVE ? ` <button data-reset style="margin-left:8px">Reset hand edits</button>` : ""}</div>`;
}

function postsTab(s) {
  const snap = latestSnap(s);
  const live = Object.fromEntries(s.posts.map(p => [`${p.hi}-${p.lo}`, p]));
  const byHandle = Object.fromEntries(s.entries.map(e => [e.handle, e]));
  const snapNames = snap ? Object.fromEntries(snap.entries.map(e => [e.handle, e])) : {};
  const list = snap ? snap.posts : s.posts;
  const head = snap
    ? `<div class="callout">Posts as frozen in the <b>${snap.date}</b> snapshot${snap.label ? ` (${esc(snap.label)})` : ""}. ${LIVE
        ? "Mark each one published as it goes up." : `Mark one published with
        <span class="cmd">python3 -I series.py publish ${s.id} N --url https://www.instagram.com/p/…</span>`}</div>`
    : `<div class="callout">The posts as the live ranking would make them. ${LIVE
        ? "Render them, then <b>Take snapshot</b> (top right) to freeze this edition and track publishing."
        : `Render them with <span class="cmd">python3 -I posts.py -s ${s.id}</span>, then freeze the edition with
        <span class="cmd">python3 -I series.py snapshot ${s.id}</span> to track publishing.`}</div>`;
  const render = LIVE ? `<div class="card" style="margin-bottom:14px"><div class="actions">
      <button data-render="${s.id}" ${s.warning ? "disabled" : ""}>Render posts</button>
      <label class="muted small"><input type="checkbox" id="nofetch"> only photos already downloaded</label>
      <span class="muted small">runs <span class="cmd">posts.py -s ${s.id}</span>: picks photos (through fwdproxy), renders slides, writes captions</span>
    </div><div id="job"></div></div>` : "";
  return head + render + list.map(p => {
    const lp = live[`${p.hi}-${p.lo}`];
    const changed = snap && (!lp || lp.handles.join() !== p.handles.join());
    const pub = p.published;
    const r = s.rendered[p.slug];
    const status = !snap ? `<span class="pill none">○ draft</span>`
      : pub ? `<span class="pill good">✓ published ${esc(pub.date)}</span>${pub.url ? ` <a class="small" style="font-weight:400" href="${esc(pub.url)}" target="_blank">view post ↗</a>` : ""}`
      : `<span class="pill none">○ not published</span>`;
    const of = list.length;
    const label = of === 1 ? `No. ${p.hi} → ${p.lo}` : p.lo === 1 ? `Top ${p.hi}` : `No. ${p.hi} → ${p.lo}`;
    const shops = p.handles.map((h, i) => {
      const e = (snap && snapNames[h]) || byHandle[h];
      const rank = p.hi - i;
      const nowAt = lp ? lp.handles[i] : null;
      const chg = snap && nowAt && nowAt !== h;
      return `<li class="${chg ? "chg" : ""}" ${chg ? `title="live ranking now has @${esc(nowAt)} here"` : ""}><b>${rank}</b>${esc(e ? e.display : h)}${chg ? " △" : ""}</li>`;
    }).join("");
    return `<section class="card post" id="post-${p.n}">
      <div>
        <h3>Part ${p.n} of ${of} · ${label} ${status}</h3>
        ${changed ? `<div class="callout warn small">The live ranking has changed in this range since the snapshot (△ marks the slots).</div>` : ""}
        ${r ? `<div class="thumbs">${r.slides.map(src => `<img src="${esc(src)}" loading="lazy" alt="">`).join("")}</div>
               <div class="muted small">rendered ${esc(r.time.replace("T", " "))} · <code>series/${s.id}/posts/${p.slug}/</code></div>`
            : `<div class="muted small" style="margin:8px 0">Not rendered on this machine: <span class="cmd">python3 -I posts.py -s ${s.id}</span></div>`}
        <ol class="shops">${shops}</ol>
      </div>
      <div>
        <details ${p.n === 1 ? "open" : ""}><summary>Caption · ${[...p.caption].length.toLocaleString()} / 2,200 characters</summary>
          <pre class="caption">${esc(p.caption)}</pre></details>
        <div style="margin-top:8px"><button data-copy="${p.n}">Copy caption</button></div>
        ${LIVE && snap ? (pub
          ? `<div class="pubform"><button data-unpub="${p.n}">Mark not published</button></div>`
          : `<div class="pubform"><input type="url" id="url-${p.n}" placeholder="https://www.instagram.com/p/…">
               <input type="date" id="date-${p.n}" value="${today()}"><button class="primary" data-pub="${p.n}">Mark published</button></div>`) : ""}
      </div></section>`;
  }).join("");
}

function snapshotsTab(s) {
  const st = stateOf(s);
  if (!s.snapshots.length) {
    return `<div class="callout">No snapshots yet. A snapshot freezes this series on a date: every candidate's rank and score, and
      each post's shops and caption. Take one when an edition's posts go out, record each post as it is published, and
      compare later rankings against it.<br>${LIVE ? "Use <b>Take snapshot</b> at the top right." : `<span class="cmd">python3 -I series.py snapshot ${s.id} --label "First edition"</span>`}</div>`;
  }
  const opts = sel => [`<option value="live" ${sel === "live" ? "selected" : ""}>live ranking</option>`,
    ...[...s.snapshots].reverse().map(x => `<option value="${x.date}" ${x.date === sel ? "selected" : ""}>${x.date}${x.label ? ` · ${esc(x.label)}` : ""}</option>`)].join("");
  const pick = d => d === "live" ? s.entries : (s.snapshots.find(x => x.date === d) || {}).entries || [];
  const c = compare(pick(st.from), pick(st.to), s.top_n);
  const up = c.moved.filter(m => m.d > 0).sort((a, b) => b.d - a.d);
  const down = c.moved.filter(m => m.d < 0).sort((a, b) => a.d - b.d);
  const li = (e, right) => `<li><span><b>${e.rank}</b> ${esc(e.display)}</span><span>${right}</span></li>`;
  return `<div class="card" style="overflow-x:auto"><table>
      <thead><tr><th>Date</th><th>Label</th><th>Ranking</th><th class="num">Candidates</th><th class="num">Top</th><th>Posts published</th><th>Taken</th></tr></thead>
      <tbody>${[...s.snapshots].reverse().map(x => `<tr>
        <td><b>${x.date}</b></td><td>${esc(x.label) || `<span class="muted">–</span>`}</td>
        <td>${x.ranking && x.ranking.commit ? `<code>${esc(x.ranking.commit)}</code>${x.ranking.modified ? ` <span class="muted small">+ uncommitted changes</span>` : ""}` : "–"}</td>
        <td class="num">${x.n_candidates}</td><td class="num">${x.top_n}</td>
        <td>${publishedCount(x)} / ${x.posts.length}
          <div class="steps" style="max-width:160px">${x.posts.map(p => `<i class="${p.published ? "on" : ""}" title="Part ${p.n}${p.published ? ": " + esc(p.published.date) : ""}"></i>`).join("")}</div></td>
        <td class="muted small">${esc(x.taken.replace("T", " "))}</td></tr>`).join("")}</tbody></table></div>
    <div class="section">
      <h2>What changed</h2>
      <div class="filters"><label>From <select id="from">${opts(st.from)}</select></label>
        <label>to <select id="to">${opts(st.to)}</select></label>
        <span class="muted small">top ${s.top_n}: ${c.entered.length} in, ${c.left.length} out, ${up.length} up, ${down.length} down</span></div>
      <div class="grid3">
        <div class="card"><h3>Entered the top ${s.top_n}</h3><ul class="moves">${c.entered.map(e => li(e,
          c.was.has(key(e)) ? `<span class="delta new">was ${c.was.get(key(e)).rank}</span>` : `<span class="delta new">new candidate</span>`)).join("") || `<li class="muted">none</li>`}</ul>
          <h3 style="margin-top:14px">Left the top ${s.top_n}</h3><ul class="moves">${c.left.map(e => li(e, `<span class="delta down">out</span>`)).join("") || `<li class="muted">none</li>`}</ul></div>
        <div class="card"><h3>Moved up</h3><ul class="moves">${up.map(m => li(m.e, `<span class="delta up">▲ ${m.d} (was ${m.e.rank + m.d})</span>`)).join("") || `<li class="muted">none</li>`}</ul></div>
        <div class="card"><h3>Moved down</h3><ul class="moves">${down.map(m => li(m.e, `<span class="delta down">▼ ${-m.d} (was ${m.e.rank + m.d})</span>`)).join("") || `<li class="muted">none</li>`}</ul></div>
      </div>
    </div>`;
}

// --- Editing (only when series_server.py serves the page) ------------------------------
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

function toast(msg, err) {
  const el = $("toast");
  el.textContent = msg;
  el.className = err ? "err" : "";
  el.style.display = "block";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.style.display = "none"; }, err ? 6000 : 2500);
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: { "Content-Type": "application/json", "X-Series-Token": LIVE.token },
    body: method === "GET" ? undefined : JSON.stringify(body || {}),
  });
  const data = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) { const e = new Error(data.error || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return data;
}

// Reload the page (the server rebuilds it from the files), landing on `hash`.
function reloadAt(hash) {
  if (hash && location.hash !== hash) location.hash = hash;
  location.reload();
}

function bindEditing(s, parts) {
  const all = sel => document.querySelectorAll(sel);
  all("[data-new]").forEach(b => b.onclick = () => openForm({ mode: "new", project: b.dataset.new }));
  all("[data-edit]").forEach(b => b.onclick = () => openForm({ mode: "edit", s: SERIES[b.dataset.edit] }));
  all("[data-del]").forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    if (!confirm(`Delete the series ${id}? This removes series/${id}/ (its series.json and any rendered posts).`)) return;
    try { await api("DELETE", `/api/series/${id}`); reloadAt("#/"); } catch (e) { toast(e.message, true); }
  });
  all("[data-snap]").forEach(b => b.onclick = () => takeSnapshot(SERIES[b.dataset.snap]));
  if (!s) return;
  const adjust = async body => {
    try { await api("POST", `/api/series/${s.id}/adjust`, body); reloadAt(); } catch (e) { toast(e.message, true); }
  };
  all(".rowacts button").forEach(b => b.onclick = () => {
    const td = b.closest(".rowacts"), handle = td.dataset.h, rank = +td.dataset.rank, act = b.dataset.act;
    if (act === "up" || act === "down") return adjust({ action: "move", handle, rank: rank + (act === "up" ? -1 : 1) });
    if (act === "unpin") return adjust({ action: "unpin", handle });
    if (act === "pin") {
      const r = prompt(`Put @${handle} at which rank in this series? (1-${s.entries.length}; others keep score order)`, rank);
      if (r === null) return;
      const note = prompt("Why? (optional, shown on the dashboard)", "");
      if (note === null) return;
      return adjust({ action: "move", handle, rank: parseInt(r, 10), note: note.trim() || null });
    }
    if (act === "exclude") {
      const reason = prompt(`Leave @${handle} out of ${s.title}? Say why (shown on the dashboard):`, "");
      if (reason === null) return;
      if (!reason.trim()) return toast("A reason is needed", true);
      return adjust({ action: "exclude", handle, reason: reason.trim() });
    }
  });
  all("[data-restore]").forEach(b => b.onclick = () => adjust({ action: "restore", handle: b.dataset.restore }));
  all("[data-reset]").forEach(b => b.onclick = () => {
    if (confirm("Remove every pin and bring back every venue left out of this series?")) adjust({ action: "reset" });
  });
  all("[data-pub]").forEach(b => b.onclick = async () => {
    const n = +b.dataset.pub;
    try {
      await api("POST", `/api/series/${s.id}/publish`, { n, url: $(`url-${n}`).value.trim(), date: $(`date-${n}`).value });
      reloadAt();
    } catch (e) { toast(e.message, true); }
  });
  all("[data-unpub]").forEach(b => b.onclick = async () => {
    if (!confirm(`Mark post ${b.dataset.unpub} as not published? Its date and link are removed.`)) return;
    try { await api("POST", `/api/series/${s.id}/unpublish`, { n: +b.dataset.unpub }); reloadAt(); } catch (e) { toast(e.message, true); }
  });
  all("[data-render]").forEach(b => b.onclick = async () => {
    try { showJob(s, await api("POST", `/api/series/${s.id}/render`, { no_fetch: $("nofetch").checked })); }
    catch (e) { toast(e.message, true); }
  });
  if ($("job")) api("GET", `/api/jobs/${s.id}`).then(j => j.command && showJob(s, j)).catch(() => {});
}

async function takeSnapshot(s) {
  const label = prompt(`Snapshot ${s.title} as of ${today()}.\nLabel (optional), e.g. "First edition" or "Spring 2027 refresh":`, "");
  if (label === null) return;
  try {
    await api("POST", `/api/series/${s.id}/snapshot`, { label });
  } catch (e) {
    if (e.status !== 409) return toast(e.message, true);
    if (!confirm(`${e.message}. Retake it? Publication records are kept for posts whose rank ranges are unchanged.`)) return;
    try { await api("POST", `/api/series/${s.id}/snapshot`, { label, replace: true }); } catch (e2) { return toast(e2.message, true); }
  }
  reloadAt(`#/s/${s.id}/snapshots`);
}

let JOB_TIMER = null;
function showJob(s, j) {
  const el = $("job");
  if (!el) return;
  const state = j.running ? `<span class="pill warn">● rendering</span>`
    : j.returncode === 0 ? `<span class="pill good">✓ finished</span> <button id="jobreload">Reload to see the slides</button>`
    : `<span class="pill" style="color:var(--critical)">✕ failed (exit ${j.returncode})</span>`;
  el.innerHTML = `<div class="actions" style="margin-top:10px">${state}<span class="muted small">${esc(j.command)} · started ${esc((j.started || "").replace("T", " "))}</span></div>
    <pre class="log">${esc(j.log.join("\n")) || "…"}</pre>`;
  const log = el.querySelector(".log");
  log.scrollTop = log.scrollHeight;
  if ($("jobreload")) $("jobreload").onclick = () => reloadAt();
  document.querySelectorAll("[data-render]").forEach(b => { b.disabled = j.running; });
  clearTimeout(JOB_TIMER);
  if (j.running) JOB_TIMER = setTimeout(() => api("GET", `/api/jobs/${s.id}`).then(n => showJob(s, n)).catch(() => {}), 1500);
}

// --- The series form -------------------------------------------------------------------
// New: the wording follows the scaffold (the project's wording with the top N and place
// swapped) until you edit a field. Edit: fields show what series.json sets; an empty field
// falls back to the project's wording, shown greyed.
const WORDING = [
  ["series.short", "Short name", "corner mark on every slide"],
  ["series.title", "Series title", "caption headline, title card alt text"],
  ["series.zh", "Chinese title", "title card"],
  ["series.hashtag", "Series hashtag", "last hashtag of every post"],
  ["series.page_title", "Preview page title", ""],
  ["caption.intro", "Caption intro", "{n} = number of candidates"],
  ["caption.outro_next", "Caption outro (more to come)", "{hi} / {lo} = the next post's range"],
  ["caption.outro_last", "Caption outro (last post)", ""],
];
let F = null;

function get(obj, path) { return path.split(".").reduce((o, k) => (o || {})[k], obj); }

function openForm(opts) {
  const s = opts.s;
  const d = s ? s.defn : {};
  const pid = s ? s.project : (opts.project || Object.keys(DATA.projects)[0]);
  const posts = d.posts;
  F = {
    mode: opts.mode, s, touched: new Set(), scaffold: null, lastTop: d.top_n || (s ? s.top_n : 10),
    v: {
      id: s ? s.id : "", project: pid, title: d.title || "", top_n: d.top_n || (s ? s.top_n : 10),
      district: new Set((d.filter || {}).district || []), area: ((d.filter || {}).area || [""])[0],
      type: ((d.filter || {}).type || [""])[0], where: d.where || "",
      postsMode: !posts ? "tens" : posts.length === 1 && posts[0][1] === 1 ? "one" : "custom",
      postsCustom: posts ? posts.map(([a, b]) => `${a}-${b}`).join(", ") : "",
      hashtags: (d.hashtags || []).join(" "),
      headline: (d.series || {}).headline || ["", "", ""],
    },
  };
  WORDING.forEach(([k]) => { F.v[k] = get(d, k) || ""; });
  drawForm();
  $("dlg").showModal();
  refreshScaffold();
}

function drawForm() {
  const v = F.v, edit = F.mode === "edit";
  const p = DATA.projects[v.project];
  const inh = edit ? F.s.inherited : null;
  const ph = k => esc(edit ? (get(inh, k) || "") : "");
  const dcounts = Object.entries(p.counts.district).sort((a, b) => b[1] - a[1]);
  $("dlgform").innerHTML = `
    <div class="dh"><h2 style="margin:0">${edit ? `Edit ${esc(F.s.id)}` : "New series"}</h2><span class="count" id="fcount"></span></div>
    <div class="db"><div class="fgrid">
      <label>Project</label><div><select id="f-project" ${edit ? "disabled" : ""}>${Object.entries(DATA.projects).map(([k, x]) =>
        `<option value="${k}" ${k === v.project ? "selected" : ""}>${esc(x.title)} (${k}, ${x.n_candidates} candidates)</option>`).join("")}</select></div>
      <label>Top N</label><div><input type="number" id="f-top_n" min="1" max="500" value="${v.top_n}" style="width:110px"></div>
      <label>Districts</label><div><div class="districts">${dcounts.map(([k, n]) =>
        `<label><input type="checkbox" data-district="${esc(k)}" ${v.district.has(k) ? "checked" : ""}>${esc(p.districts[k] || k)} ${esc(k)}<em>${n}</em></label>`).join("")}</div>
        <div class="hint">None ticked: every district. Numbers are candidates with a shop there.</div></div>
      <label>City</label><div><select id="f-area"><option value="">Greater Taipei (both)</option>${Object.entries(p.counts.area).map(([k, n]) =>
        `<option value="${esc(k)}" ${k === v.area ? "selected" : ""}>${esc(k)} (${n})</option>`).join("")}</select></div>
      <label>Shop type</label><div><select id="f-type"><option value="">All types</option>${Object.entries(p.counts.type).map(([k, n]) =>
        `<option value="${esc(k)}" ${k === v.type ? "selected" : ""}>${esc(p.types[k] || k)} (${n})</option>`).join("")}</select></div>
      <label>Posts</label><div><select id="f-postsMode">
          <option value="tens" ${v.postsMode === "tens" ? "selected" : ""}>Countdown in tens, then 10–4 and the top 3</option>
          <option value="one" ${v.postsMode === "one" ? "selected" : ""}>One post with every entry</option>
          <option value="custom" ${v.postsMode === "custom" ? "selected" : ""}>Custom ranges</option></select>
        <input type="text" id="f-postsCustom" value="${esc(v.postsCustom)}" placeholder="e.g. 20-11, 10-4, 3-1"
          style="margin-top:6px;${v.postsMode === "custom" ? "" : "display:none"}">
        <div class="hint" id="postsHint"></div></div>
      ${edit ? "" : `<label>ID</label><div><input type="text" id="f-id" value="${esc(v.id)}" placeholder="coffee-xinyi-top10">
        <div class="hint">Folder name under series/: lowercase letters, digits, dashes. Can't be changed later.</div></div>`}
      <label>Dashboard name</label><div><input type="text" id="f-title" value="${esc(v.title)}" placeholder="${edit ? esc(inh.title) : ""}"></div>
      <label>Where</label><div><input type="text" id="f-where" value="${esc(v.where)}" placeholder="${edit ? "Greater Taipei" : ""}">
        <div class="hint">Fills {where} in the wording ("We ranked 11 coffee shops across Xinyi, Taipei").</div></div>
      <h4>Wording ${edit ? `<span class="muted small" style="font-weight:400">· empty = the project's default, shown greyed</span>` : `<span class="muted small" style="font-weight:400">· suggested from the project's wording; edit freely</span>`}</h4>
      <label>Title card headline</label><div><div class="headline3">
          ${[0, 1, 2].map(i => `<textarea rows="${i === 2 ? 2 : 1}" data-headline="${i}" placeholder="${edit ? esc((inh.series.headline || [])[i] || "") : ["The", "Top 10", "coffee shops in\\nXinyi"][i]}">${esc(v.headline[i] || "")}</textarea>`).join("")}</div>
        <div class="hint">lead · <b>bold</b> · rest (a line break where the card should break)</div></div>
      ${WORDING.map(([k, label, hint]) => `<label>${label}</label><div>${k.startsWith("caption.")
        ? `<textarea rows="2" data-w="${k}" placeholder="${ph(k)}">${esc(v[k])}</textarea>`
        : `<input type="text" data-w="${k}" value="${esc(v[k])}" placeholder="${ph(k)}">`}${hint ? `<div class="hint">${esc(hint)}</div>` : ""}</div>`).join("")}
      <label>Hashtags</label><div><input type="text" id="f-hashtags" value="${esc(v.hashtags)}" placeholder="${esc(p.hashtags.join(" "))}">
        <div class="hint">Before the district and series hashtags; Instagram allows 5 in all.</div></div>
    </div></div>
    <div class="df"><span class="muted small" id="ferr"></span>
      <div class="actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="fsave" value="save">${edit ? "Save" : "Create series"}</button></div></div>`;
  wireForm();
  showCount();
}

function wireForm() {
  const v = F.v;
  const on = (id, f, ev = "input") => { const el = $(id); if (el) el.addEventListener(ev, f); };
  on("f-project", e => { v.project = e.target.value; v.district.clear(); v.area = v.type = ""; drawForm(); refreshScaffold(); }, "change");
  on("f-top_n", e => {
    v.top_n = parseInt(e.target.value, 10) || "";
    // Compare with the last valid number, so clearing the field and typing a new one still swaps.
    if (v.top_n) { if (F.lastTop && F.lastTop !== v.top_n) swapTop(F.lastTop, v.top_n); F.lastTop = v.top_n; }
    refreshScaffold();
  });
  on("f-area", e => { v.area = e.target.value; refreshScaffold(); }, "change");
  on("f-type", e => { v.type = e.target.value; refreshScaffold(); }, "change");
  on("f-postsMode", e => { v.postsMode = e.target.value; F.touched.add("postsMode"); $("f-postsCustom").style.display = v.postsMode === "custom" ? "" : "none"; showCount(); }, "change");
  on("f-postsCustom", e => { v.postsCustom = e.target.value; showCount(); });
  document.querySelectorAll("[data-district]").forEach(c => c.addEventListener("change", () => {
    c.checked ? v.district.add(c.dataset.district) : v.district.delete(c.dataset.district); refreshScaffold();
  }));
  const touch = (k, val) => { v[k] = val; F.touched.add(k); };
  on("f-id", e => touch("id", e.target.value.trim()));
  on("f-title", e => touch("title", e.target.value));
  on("f-where", e => { touch("where", e.target.value); refreshScaffold(); });
  on("f-hashtags", e => { v.hashtags = e.target.value; });
  document.querySelectorAll("[data-w]").forEach(el => el.addEventListener("input", () => touch(el.dataset.w, el.value)));
  document.querySelectorAll("[data-headline]").forEach(el => el.addEventListener("input", () => {
    v.headline[+el.dataset.headline] = el.value; F.touched.add("headline");
  }));
  $("dlgform").onsubmit = e => {
    if (e.submitter && e.submitter.value === "save") { e.preventDefault(); save(); }
  };
}

// A new top N rewrites the old number where the wording has it ("Top 10" -> "Top 8", "#…top10").
function swapTop(was, now) {
  const v = F.v, re = new RegExp(`(?<!\\d)${was}(?!\\d)`, "g");
  const swap = x => (x || "").replace(re, String(now));
  ["title", "series.short", "series.title", "series.zh", "series.hashtag", "series.page_title"].forEach(k => { v[k] = swap(v[k]); });
  v.headline = v.headline.map(swap);
  const el = sel => document.querySelector(sel);
  if (el("#f-title")) el("#f-title").value = v.title;
  document.querySelectorAll("[data-w]").forEach(x => { x.value = v[x.dataset.w] || ""; });
  document.querySelectorAll("[data-headline]").forEach(x => { x.value = v.headline[+x.dataset.headline] || ""; });
}

function filterOf() {
  const v = F.v, f = {};
  if (v.district.size) f.district = [...v.district];
  if (v.area) f.area = [v.area];
  if (v.type) f.type = [v.type];
  return f;
}

let SCAFFOLD_T = null;
function refreshScaffold() {
  clearTimeout(SCAFFOLD_T);
  SCAFFOLD_T = setTimeout(async () => {
    const v = F.v;
    try {
      const sc = await api("POST", "/api/scaffold", { project: v.project, top_n: v.top_n || null, filter: filterOf(),
                                                      where: F.touched.has("where") || F.mode === "edit" ? v.where : "" });
      F.scaffold = sc;
      if (F.mode === "new") {
        // Fill what hasn't been typed over.
        const set = (k, val, sel) => { if (!F.touched.has(k)) { v[k] = val || ""; const el = document.querySelector(sel); if (el) el.value = v[k]; } };
        set("id", sc.id, "#f-id");
        set("title", sc.title, "#f-title");
        set("where", sc.where, "#f-where");
        ["short", "title", "zh", "hashtag", "page_title"].forEach(k => set(`series.${k}`, sc.series[k], `[data-w="series.${k}"]`));
        if (!F.touched.has("headline") && sc.series.headline) {
          v.headline = [...sc.series.headline];
          document.querySelectorAll("[data-headline]").forEach(el => { el.value = v.headline[+el.dataset.headline]; });
        }
        if (!F.touched.has("postsMode")) {
          v.postsMode = (v.top_n || 0) <= 10 ? "one" : "tens";
          const el = $("f-postsMode"); if (el) el.value = v.postsMode;
          if ($("f-postsCustom")) $("f-postsCustom").style.display = v.postsMode === "custom" ? "" : "none";
        }
      } else if ($("f-where")) {
        $("f-where").placeholder = sc.where;
      }
      showCount();
    } catch (e) { $("ferr").textContent = e.message; }
  }, 200);
}

function plan() {
  const v = F.v, top = v.top_n || 0;
  if (v.postsMode === "one") return [[top, 1]];
  if (v.postsMode === "custom") {
    return v.postsCustom.split(/[,;]\s*/).filter(Boolean).map(x => x.split(/\s*[-–→]\s*/).map(n => parseInt(n, 10)));
  }
  const out = []; let hi = top;
  while (hi > 10) { out.push([hi, hi - 9]); hi -= 10; }
  return out.concat(top >= 10 ? [[10, 4], [3, 1]] : [[hi, 1]]);
}

function showCount() {
  const el = $("fcount"); if (!el) return;
  const sc = F.scaffold, top = F.v.top_n || 0;
  if (sc) {
    el.textContent = `${sc.candidates} candidates match · top ${top || "?"}`;
    el.className = "count" + (sc.candidates < top ? " warn" : "");
    if (sc.candidates < top) el.textContent += " (too few)";
  }
  const p = plan(), ok = p.every(r => r.length === 2 && r.every(Number.isInteger));
  $("postsHint").textContent = ok ? `${p.length} post${p.length > 1 ? "s" : ""}: ${p.map(([a, b]) => `No. ${a}–${b}`).join(", ")}${p.length === 1 ? ` (${top + 1} slides; Instagram allows 20)` : ""}`
                                  : "Write ranges like 20-11, 10-4, 3-1";
}

function definition() {
  const v = F.v, d = { project: v.project };
  if (v.title.trim()) d.title = v.title.trim();
  if (v.top_n) d.top_n = v.top_n;
  const f = filterOf(); if (Object.keys(f).length) d.filter = f;
  if (v.where.trim()) d.where = v.where.trim();
  if (v.postsMode !== "tens") d.posts = plan();
  const series = {}, caption = {};
  WORDING.forEach(([k]) => { const val = (v[k] || "").trim(); if (val) (k.startsWith("series.") ? series : caption)[k.split(".")[1]] = val; });
  if (v.headline.some(x => x.trim())) series.headline = v.headline.map(x => x.replace(/^\s+|\s+$/g, ""));
  if (Object.keys(series).length) d.series = series;
  if (Object.keys(caption).length) d.caption = caption;
  const tags = v.hashtags.split(/[\s,]+/).filter(Boolean);
  if (tags.length) d.hashtags = tags;
  if (F.mode === "edit" && F.s.defn.adjust) d.adjust = F.s.defn.adjust;  // hand edits aren't in the form
  return d;
}

async function save() {
  $("ferr").textContent = "";
  $("fsave").disabled = true;
  try {
    if (F.mode === "edit") {
      await api("PUT", `/api/series/${F.s.id}`, { definition: definition() });
      $("dlg").close();
      reloadAt();
    } else {
      const out = await api("POST", "/api/series", { id: F.v.id, definition: definition() });
      $("dlg").close();
      reloadAt(`#/s/${out.id}/rankings`);
    }
  } catch (e) {
    $("ferr").textContent = e.message;
    $("ferr").style.color = "var(--critical)";
  } finally {
    if ($("fsave")) $("fsave").disabled = false;
  }
}

// --- Routing and events ----------------------------------------------------------------
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  let html, nav = "";
  if (parts[0] === "venues") { html = venues(); nav = "venues"; document.title = "Venues · Series"; }
  else if (parts[0] === "s" && SERIES[parts[1]]) {
    const s = SERIES[parts[1]];
    html = seriesPage(s, parts[2] || "rankings");
    document.title = `${s.title} · Series`;
  } else { html = overview(); nav = "overview"; document.title = "Series dashboard"; }
  $("main").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a => a.setAttribute("aria-pressed", a.dataset.nav === nav));
  bind(parts);
}

function bind(parts) {
  const s = parts[0] === "s" ? SERIES[parts[1]] : null;
  if (LIVE) bindEditing(s, parts);
  const on = (id, ev, f) => { const el = $(id); if (el) el.addEventListener(ev, f); };
  const keepFocus = (id, f) => on(id, "input", e => { f(e.target.value); route(); const el = $(id); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
  keepFocus("vq", v => { VSTATE.q = v; });
  on("vmulti", "change", e => { VSTATE.multi = e.target.checked; route(); });
  if (s) {
    const st = stateOf(s);
    keepFocus("q", v => { st.q = v; });
    on("all", "change", e => { st.all = e.target.checked; route(); });
    on("base", "change", e => { st.base = e.target.value; route(); });
    on("from", "change", e => { st.from = e.target.value; route(); });
    on("to", "change", e => { st.to = e.target.value; route(); });
    document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
      const snap = latestSnap(s), list = snap ? snap.posts : s.posts;
      await navigator.clipboard.writeText(list.find(p => p.n === +b.dataset.copy).caption);
      b.textContent = "Copied ✓";
      setTimeout(() => { b.textContent = "Copy caption"; }, 1500);
    });
    // Score tooltip: the components behind the score (0-100 each, before weighting).
    const tip = $("tip");
    document.querySelectorAll("[data-tip]").forEach(el => {
      el.addEventListener("mousemove", ev => {
        const e = s.entries.find(x => x.handle === el.dataset.tip);
        const comp = e.comp ? Object.entries(e.comp).map(([k, v]) => `<div class="r"><span>${COMP[k] || k}</span><b>${Math.round(v * 100)}</b></div>`).join("")
          : `<div class="r">Branch score; its parts are on the brand's row in the project ranking.</div>`;
        tip.innerHTML = `<div class="t">${esc(e.display)} · ${e.score.toFixed(1)}</div>${comp}`;
        tip.style.display = "block";
        tip.style.left = Math.min(ev.clientX + 14, innerWidth - 300) + "px";
        tip.style.top = ev.clientY + 14 + "px";
      });
      el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    });
  }
}

$("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
$("foot").textContent = LIVE ? `Served by series.py serve · built ${DATA.generated.replace("T", " ")} · changes are saved to series/ in the repo.`
  : `Generated ${DATA.generated.replace("T", " ")} by series.py dashboard (also rewritten by posts.py and every series.py command).`;
$("mode").innerHTML = LIVE ? `<b>●</b> editing on` : `read-only · to edit, run <span class="cmd">python3 -I series.py serve</span>`;
window.addEventListener("hashchange", route);
route();
</script>
